name: Build Desktop & Android Apps

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile-android/**"
      - "desktop/**"
      - ".github/workflows/build-apps.yml"

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build Android Debug APK
        working-directory: mobile-android
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk AnyCraft-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AnyCraft-Android-APK
          path: mobile-android/AnyCraft-Android.apk

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install & Build Windows EXE
        working-directory: desktop
        run: |
          npm install
          npm run build:win
          Copy-Item dist\*.exe AnyCraft-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: AnyCraft-Windows-EXE
          path: desktop/AnyCraft-Windows.exe

  mac-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install & Build macOS DMG
        working-directory: desktop
        run: |
          npm install
          npm run build:mac
          cp dist/*.dmg AnyCraft-Mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: AnyCraft-Mac-DMG
          path: desktop/AnyCraft-Mac.dmg

  publish-release:
    needs: [android-apk, windows-exe, mac-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: AnyCraft v1.0.0
          body: "Official AnyCraft Desktop (Windows & Mac) and Android (with native screen sharing) builds."
          files: release-files/*
