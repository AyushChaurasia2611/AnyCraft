name: Build Desktop & Android Apps

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile-android/**"
      - "desktop/**"
      - ".github/workflows/build-apps.yml"

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build Android Debug APK
        working-directory: mobile-android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AnyCraft-Android-APK
          path: mobile-android/app/build/outputs/apk/debug/app-debug.apk

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install & Build Windows EXE
        working-directory: desktop
        run: |
          npm install
          npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: AnyCraft-Windows-EXE
          path: desktop/dist/*.exe

  mac-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install & Build macOS DMG
        working-directory: desktop
        run: |
          npm install
          npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: AnyCraft-Mac-DMG
          path: desktop/dist/*.dmg
