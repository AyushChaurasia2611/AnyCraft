name: Keep Render Alive

on:
  schedule:
    # Ping every 12 minutes to prevent Render free-tier 15-minute idle spin-down
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping AnyCraft health endpoint
        run: |
          curl -fsS --retry 2 --max-time 25 https://anycraft.onrender.com/health
          echo ""
